<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="angel1.jpg">

  <title>Cantinho do Anjo Charmoso</title>
</head>

<body>
  <button class="theme-toggle" id="themeToggle">
  🌙
</button>

  <div class="glow-follow"></div>


  <div class="mushroom m1">🍄</div>
  <div class="mushroom m2">✨</div>
  <div class="mushroom m3">🌙</div>

  
  <div class="card main-card">


    <div class="profile-area">
      <img src="angel1.jpg" alt="Angel" class="profile-img">

      <h1>Charms Angel</h1>

      <p class="subtitle">
        magia, estrelas e boas vibrações ✨
      </p>
    </div>

  
    <div class="tabs">

      <button class="tab-btn active">
        <a href="sobremim.html">
        🌙 Sobre mim
        </a>
      </button>

      <button class="tab-btn">
        <a href="comissoes.html">
        🍄 Comissões e produtos
        </a>
      </button>

      <button class="tab-btn">
         <a href="redessociais.html">
        ✨ Redes sociais
        </a>
      </button>

    </div>
    <div class="tab-content">

      <p>
        💜1.9y - ENFP 🎨 (she/he)🍄
        💜 artes visuais | artesanato 💜
        ★ MULTI ARTISTA ★
        arte é política

      </p>

   

    </div>

  </div>

  <script>
    const glow = document.querySelector(".glow-follow");

    document.addEventListener("mousemove", (e) => {
      glow.style.left = e.clientX + "px";
      glow.style.top = e.clientY + "px";
    });

    const buttons = document.querySelectorAll(".tab-btn");

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {

        buttons.forEach(b =>
          b.classList.remove("active")
        );

        btn.classList.add("active");

      });
    });
  </script>
<script>

  const toggleBtn = document.getElementById("themeToggle");

  toggleBtn.addEventListener("click", () => {

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")) {
      toggleBtn.innerHTML = "☀️";
    } else {
      toggleBtn.innerHTML = "🌙";
    }

  });

</script>

</body>
</html>
